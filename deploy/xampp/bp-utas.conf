# BP Utas – Apache (XAMPP) reverse proxy a Node szerver elé.
#
# 1) Másold ezt a fájlt ide:   C:\xampp\apache\conf\extra\bp-utas.conf
# 2) A C:\xampp\apache\conf\httpd.conf végére írd be:
#        Include conf/extra/bp-utas.conf
#    és ellenőrizd, hogy ezek a sorok NINCSENEK kikommentezve (# nélkül legyenek):
#        LoadModule proxy_module modules/mod_proxy.so
#        LoadModule proxy_http_module modules/mod_proxy_http.so
# 3) Apache újraindítása a XAMPP Control Panelben.
#
# Ezután az app itt érhető el:  http://localhost/utas/
# Ha más alútvonalat szeretnél, írd át itt az "/utas/"-t, és a gyökér .env-ben a BASE_PATH-t is, majd: npm run build

ProxyPreserveHost On
ProxyTimeout 60

RedirectMatch 301 ^/utas$ /utas/
ProxyPass        /utas/ http://127.0.0.1:8787/
ProxyPassReverse /utas/ http://127.0.0.1:8787/
