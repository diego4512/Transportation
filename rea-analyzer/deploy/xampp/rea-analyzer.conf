# REA Web Analyzer – opcionális Apache (XAMPP) konfiguráció
# -----------------------------------------------------------------------------
# A legegyszerűbb telepítés: tedd a `rea-analyzer` mappát a C:\xampp\htdocs alá,
# ekkor a projekt gyökerében lévő .htaccess elvégzi a routingot, és az app a
# http://localhost/rea-analyzer/ címen elérhető. EHHEZ a fájlhoz NINCS szükség.
#
# Ezt a fájlt csak akkor használd, ha saját Alias-t vagy VirtualHostot szeretnél.
# Bekapcsolás: másold a C:\xampp\apache\conf\extra\ mappába, és a
# C:\xampp\apache\conf\httpd.conf végére írd be:
#     Include conf/extra/rea-analyzer.conf
# Szükséges modulok (httpd.conf-ban ne legyenek kikommentezve):
#     LoadModule rewrite_module modules/mod_rewrite.so
#     LoadModule headers_module modules/mod_headers.so
# Apache újraindítás a XAMPP vezérlőpultból.

Alias /rea-analyzer "C:/xampp/htdocs/rea-analyzer"

<Directory "C:/xampp/htdocs/rea-analyzer">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.html
</Directory>

# A nem webre szánt könyvtárak tiltása (a bennük lévő .htaccess is tiltja)
<DirectoryMatch "C:/xampp/htdocs/rea-analyzer/(storage|config|worker|bin|tests|plugins|rea-src|node_modules)">
    Require all denied
</DirectoryMatch>
